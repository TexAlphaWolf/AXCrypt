name: Security audit
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [ main ]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
permissions:
  contents: read
  issues: write
  checks: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
