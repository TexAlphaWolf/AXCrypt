[package]
name = "axcrypt-cli"
version = "0.1.0"
edition = "2021"
description = "CLI di AXCrypt."
license = "LicenseRef-Proprietary"
publish = false

[[bin]]
name = "axcrypt"
path = "src/main.rs"

[dependencies]
axcrypt-core = { path = "../core" }
clap = { version = "4.5", features = ["derive"] }
rpassword = "7.3"
anyhow = "1"
walkdir = "2.5"
